name: dromos
description: "A new Ride Sharing Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.2.0+1

environment:
  sdk: ^3.10.0

flutter_native_splash:
  color: "#EFEEFB" # Background color
  image: assets/logo.png # Path to your splash image
  android: true
  ios: true
  web: false


# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  flutter_svg: ^2.2.2
  google_fonts: ^8.0.2
  permission_handler: ^12.0.1
  flutter_local_notifications: ^21.0.0
  salomon_bottom_bar: ^3.3.2
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  http: ^1.6.0
  shared_preferences: ^2.5.4
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_native_splash: ^2.4.7
  lottie: ^3.3.2
  connectivity_plus: ^7.1.0
  flutter_dotenv: ^6.0.0
  qr_flutter: ^4.1.0
  mapbox_maps_flutter: ^2.20.1
  mobile_scanner: ^7.2.0
  pinput: ^6.0.2
  package_info_plus: ^9.0.1
  flutter_phone_direct_caller: ^2.2.1
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  flutter_stripe: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
 
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - .env.local
    - assets/
    - assets/cars/

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
